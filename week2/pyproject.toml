[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Week 2: a local Gmail MCP server built with FastMCP (stdio, OAuth 2.0)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "pydantic[email]>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
gmail-mcp = "gmail_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmail_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
